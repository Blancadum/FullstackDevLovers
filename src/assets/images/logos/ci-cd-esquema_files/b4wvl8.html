		<script>
    /**
     * Pardot → SF DOM restructurer
     * Targets the actual rendered structure after WordPress plugin transformation.
     */
    (function () {
      const form = document.getElementById("pardot-form");
      if (!form) return;
    
      // ── 1. Fix input classes ─────────────────────────────────────────────────
      form.querySelectorAll("input.text").forEach((el) => {
        el.classList.remove("text");
        el.classList.add("sf-input");
      });
      form.querySelectorAll("textarea.standard").forEach((el) => {
        el.classList.remove("standard");
        el.classList.add("sf-input", "sf-fieldtype-textarea");
      });
    
      // ── 2. Fix labels — strip trailing " *" and add proper required span ─────
      form.querySelectorAll("label").forEach((label) => {
        const span = label.querySelector("span");
        if (!span) return;
    
        const raw = span.textContent.trim();
        if (raw.endsWith("*")) {
          span.textContent = raw.replace(/\s*\*\s*$/, "").trim();
          const req = document.createElement("span");
          req.className = "sf-form-required";
          req.textContent = "*";
          label.appendChild(req);
        }
      });
    
      // ── 3. Merge col-half fieldsets into form-columns-2 pairs ───────────────
      const allFieldsets = [...form.querySelectorAll(":scope > fieldset")];
    
      let i = 0;
      while (i < allFieldsets.length) {
        const current = allFieldsets[i];
        const innerDiv = current.querySelector(".field.sf-form-field");
    
        // Skip reCAPTCHA fieldset entirely
        if (innerDiv && innerDiv.classList.contains("pd-captcha")) {
          i++;
          continue;
        }
    
        if (innerDiv && innerDiv.classList.contains("col-half")) {
          const next = allFieldsets[i + 1];
          const nextInnerDiv = next && next.querySelector(".field.sf-form-field");
    
          if (next && nextInnerDiv && nextInnerDiv.classList.contains("col-half")) {
            const merged = document.createElement("fieldset");
            merged.className = "form-columns-2";
            merged.appendChild(innerDiv);
            merged.appendChild(nextInnerDiv);
    
            current.replaceWith(merged);
            next.remove();
    
            allFieldsets.splice(i, 2, merged);
            i++;
            continue;
          } else {
            current.className = "form-columns-1";
          }
        } else {
          current.className = "form-columns-1";
        }
    
        i++;
      }

      // ── 4. Sync error classes from label → input, clear on user input ────────
      form.querySelectorAll("label").forEach((label) => {
        const hasError = label.classList.contains("error") || label.classList.contains("invalid");
        if (!hasError) return;

        const forId = label.getAttribute("for");
        if (!forId) return;

        const input = form.querySelector(`#${CSS.escape(forId)}`);
        if (!input) return;
        

        // Mirror error state onto the input
        input.classList.add("invalid", "error");

        // Clear error classes from both label and input as soon as user interacts
        const clearError = () => {
          input.classList.remove("invalid", "error");
          label.classList.remove("invalid", "error");
          input.removeEventListener("input", clearError);
          input.removeEventListener("change", clearError);
        };

        input.addEventListener("input", clearError);
        input.addEventListener("change", clearError); // covers selects
      });
      
      form.querySelectorAll(".sf-form-field").forEach((field) => {
          const labelSpan = field.querySelector("label span:not(.sf-form-required)");
          const input = field.querySelector("input, textarea");
        
          if (!labelSpan || !input) return;
        
          const labelText = labelSpan.textContent.trim();
          if (labelText) {
            input.placeholder = labelText;
          }
        });
    
      // ── 5. Remove Pardot's injected inline <style> ───────────────────────────
      const inlineStyle = form.querySelector("style");
      if (inlineStyle) inlineStyle.remove();
    })();
</script>
